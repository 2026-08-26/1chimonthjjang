<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA TIP-OFF | 미디어 트렌드 이상감지 시스템</title>
    <!-- Tailwind CSS & FontAwesome Icons CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- GNB Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <!-- Logo -->
                <a href="/" class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center font-bold text-xl tracking-wider text-white shadow-lg shadow-blue-500/30">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                    <span class="font-extrabold text-xl tracking-tight text-white">DATA <span class="text-blue-400">TIP-OFF</span></span>
                </a>

                <!-- Category Links -->
                <nav class="hidden md:flex items-center space-x-1 text-sm font-medium text-slate-300">
                    <a href="/" class="px-3 py-2 rounded-md hover:text-white hover:bg-slate-800 transition">홈/전체</a>
                    <a href="/content/music" class="px-3 py-2 rounded-md hover:text-white hover:bg-slate-800 transition">🎵 노래</a>
                    <a href="/content/drama" class="px-3 py-2 rounded-md hover:text-white hover:bg-slate-800 transition">🎬 드라마</a>
                    <a href="/content/webtoon" class="px-3 py-2 rounded-md hover:text-white hover:bg-slate-800 transition">📱 웹툰</a>
                </nav>
            </div>

            <!-- Header Right Section -->
            <div class="flex items-center space-x-4 text-xs">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-1.5"></span> 실시간 감지 중
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 mt-12">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs">
            <p>© 2026 DATA TIP-OFF Engine. 이상감지 알고리즘 기반 미디어 취재 데이터 분석 시스템</p>
        </div>
    </footer>

</body>
</html>
