<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PULSE AI | Real-time Trend Anomaly Radar</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Google Fonts: Noto Serif KR, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* Modern Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333333; border-radius: 9999px; }
        
        .editorial-card {
            transition: all 0.2s ease-in-out;
        }
        .editorial-card:hover {
            border-color: #000000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body class="bg-[#f4f4f5] text-neutral-900 font-sans antialiased min-h-screen flex flex-col selection:bg-black selection:text-white">

    <!-- =====================================
         Editorial Black Header
    ====================================== -->
    <header class="bg-[#0a0a0a] text-white border-b border-neutral-800 sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

            <!-- Logo & Brand Tagline -->
            <div class="flex items-center space-x-6">
                <a href="/" class="flex items-center space-x-3 group">
                    <span class="font-extrabold text-lg tracking-tight text-white font-mono flex items-center gap-1.5">
                        DATA TIP-OFF <span class="bg-white text-black font-mono font-black text-[10px] px-1.5 py-0.5 rounded-sm">PULSE</span>
                    </span>
                </a>
                
                <div class="hidden sm:block h-4 w-px bg-neutral-800"></div>

                <p class="hidden sm:block text-xs font-mono text-neutral-400">
                    디지털 뉴스룸 / 취재 시그널 모니터
                </p>
            </div>

            <!-- Navigation & Status -->
            <div class="flex items-center space-x-6">
                <nav class="hidden md:flex items-center space-x-1">
                    <a href="/" class="px-3 py-1.5 rounded text-xs font-mono font-semibold text-neutral-200 hover:text-white hover:bg-neutral-800 transition">
                        전체 리포트
                    </a>
                    <a href="/content/music" class="px-3 py-1.5 rounded text-xs font-mono font-semibold text-neutral-400 hover:text-white hover:bg-neutral-800 transition">
                        🎵 연예·음악
                    </a>
                    <a href="/content/drama" class="px-3 py-1.5 rounded text-xs font-mono font-semibold text-neutral-400 hover:text-white hover:bg-neutral-800 transition">
                        🎬 방송·드라마
                    </a>
                    <a href="/content/webtoon" class="px-3 py-1.5 rounded text-xs font-mono font-semibold text-neutral-400 hover:text-white hover:bg-neutral-800 transition">
                        📱 문화·웹툰
                    </a>
                </nav>

                <div class="flex items-center space-x-2 px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-[11px] font-mono text-neutral-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>탐지 시스템 활성화</span>
                </div>
            </div>

        </div>

    </header>


    <!-- =====================================
         Main Content
    ====================================== -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}
        {% endblock %}
    </main>


    <!-- =====================================
         Footer
    ====================================== -->
    <footer class="border-t border-neutral-800 bg-[#0a0a0a] text-neutral-400 py-8 mt-16 text-xs font-mono">
        <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-white">DATA-DRIVEN NEWSROOM</span>
                <span class="text-neutral-600">|</span>
                <span>PULSE AI ANOMALY ENGINE</span>
            </div>
            <p class="text-neutral-500">© 2026 PULSE LABS INC. ALL RIGHTS RESERVED.</p>
        </div>
    </footer>

</body>
</html>
