<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DATA TIP-OFF | K-CONTENTS
    </title>


    <!-- Tailwind : 상세페이지 호환 -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <!-- 현대적인 한글 + 영문 폰트 -->
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap"
    >


    <style>

        :root {

            --black:
                #0a0a0a;

            --black-soft:
                #171717;

            --white:
                #ffffff;

            --background:
                #f6f6f6;

            --surface:
                #ffffff;

            --surface-soft:
                #fafafa;

            --text:
                #111111;

            --text-secondary:
                #666666;

            --text-muted:
                #9a9a9a;

            --border:
                #dedede;

            --border-light:
                #ededed;

            --high:
                #d52b3f;

            --high-bg:
                #fff4f5;

            --medium:
                #b87600;

            --medium-bg:
                #fff9eb;

            --low:
                #16855b;

            --low-bg:
                #f1faf6;
        }


        * {
            box-sizing:
                border-box;
        }


        html {
            scroll-behavior:
                smooth;
        }


        body {

            margin:
                0;

            background:
                var(--background);

            color:
                var(--text);

            font-family:
                "Inter",
                "Noto Sans KR",
                sans-serif;

            -webkit-font-smoothing:
                antialiased;

            letter-spacing:
                -.2px;
        }


        a {

            color:
                inherit;

            text-decoration:
                none;
        }


        /* =========================================
           HEADER
        ========================================= */

        .site-header {

            height:
                72px;

            padding:
                0 42px;

            background:
                var(--black);

            color:
                white;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            position:
                sticky;

            top:
                0;

            z-index:
                1000;
        }


        .header-left {

            display:
                flex;

            align-items:
                center;

            gap:
                22px;
        }


        /* 메뉴 버튼 */

        .menu-button {

            width:
                42px;

            height:
                42px;

            border:
                1px solid #333;

            border-radius:
                9px;

            display:
                grid;

            place-items:
                center;

            color:
                #ddd;

            font-size:
                15px;

            transition:
                all .18s ease;
        }


        .menu-button:hover {

            background:
                white;

            color:
                black;

            border-color:
                white;
        }


        /* 로고 */

        .brand {

            font-size:
                20px;

            font-weight:
                900;

            letter-spacing:
                -1px;

            white-space:
                nowrap;
        }


        .brand-divider {

            width:
                1px;

            height:
                21px;

            background:
                #414141;
        }


        .brand-sub {

            color:
                #969696;

            font-size:
                10px;

            font-weight:
                500;

            letter-spacing:
                .4px;

            white-space:
                nowrap;
        }


        /* 오른쪽 */

        .header-right {

            display:
                flex;

            align-items:
                center;

            gap:
                34px;
        }


        .main-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                30px;
        }


        .main-nav a {

            position:
                relative;

            color:
                #9c9c9c;

            font-size:
                10px;

            font-weight:
                700;

            transition:
                color .18s ease;
        }


        .main-nav a:hover {

            color:
                white;
        }


        .main-nav a.active {

            color:
                white;
        }


        .main-nav a.active::after {

            content:
                "";

            position:
                absolute;

            left:
                0;

            right:
                0;

            bottom:
                -11px;

            height:
                2px;

            border-radius:
                10px;

            background:
                white;
        }


        /* 시스템 상태 */

        .system-state {

            padding:
                7px 11px;

            border:
                1px solid #313131;

            border-radius:
                30px;

            display:
                flex;

            align-items:
                center;

            gap:
                7px;

            color:
                #bbb;

            font-size:
                9px;

            font-weight:
                600;

            white-space:
                nowrap;
        }


        .system-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #f5f5f5;

            animation:
                statePulse
                1.6s
                infinite;
        }


        @keyframes statePulse {

            0%,
            100% {
                opacity:
                    1;
            }

            50% {
                opacity:
                    .25;
            }
        }


        /* =========================================
           PAGE
        ========================================= */

        .page-shell {

            width:
                min(
                    1480px,
                    calc(100% - 64px)
                );

            margin:
                0 auto;

            padding:
                38px 0 72px;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .site-footer {

            background:
                white;

            border-top:
                1px solid
                var(--border);
        }


        .footer-inner {

            width:
                min(
                    1480px,
                    calc(100% - 64px)
                );

            min-height:
                76px;

            margin:
                0 auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            color:
                #909090;

            font-size:
                9px;
        }


        .footer-brand {

            color:
                #111;

            font-size:
                13px;

            font-weight:
                900;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (
            max-width:
            1000px
        ) {

            .brand-divider,
            .brand-sub {

                display:
                    none;
            }


            .site-header {

                padding:
                    0 22px;
            }


            .page-shell,
            .footer-inner {

                width:
                    calc(100% - 32px);
            }
        }


        @media (
            max-width:
            720px
        ) {

            .site-header {

                height:
                    64px;

                padding:
                    0 14px;
            }


            .menu-button {

                width:
                    36px;

                height:
                    36px;
            }


            .brand {

                font-size:
                    17px;
            }


            .main-nav {

                display:
                    none;
            }


            .header-right {

                gap:
                    12px;
            }


            .page-shell {

                width:
                    calc(100% - 20px);

                padding-top:
                    18px;
            }


            .footer-inner {

                width:
                    calc(100% - 24px);
            }
        }

    </style>


    {% block extra_head %}
    {% endblock %}

</head>


<body>


<header class="site-header">


    <div class="header-left">


        <a
            href="/"
            class="menu-button"
            aria-label="메인"
        >
            <i class="fa-solid fa-bars"></i>
        </a>


        <a
            href="/"
            class="brand"
        >
            DATA TIP-OFF
        </a>


        <div class="brand-divider"></div>


        <div class="brand-sub">

            디지털 뉴스룸 / 취재 시그널 모니터

        </div>


    </div>



    <div class="header-right">


        <nav class="main-nav">

            <a href="/social">
                사회
            </a>

            <a href="/economy">
                경제
            </a>

            <a
                href="/trend"
                class="active"
            >
                K콘텐츠
            </a>

            <a href="/baseball">
                야구
            </a>

        </nav>



        <div class="system-state">

            <span class="system-dot"></span>

            탐지 시스템 활성화

        </div>


    </div>


</header>



<main class="page-shell">

    {% block content %}
    {% endblock %}

</main>



<footer class="site-footer">


    <div class="footer-inner">


        <div class="footer-brand">

            DATA TIP-OFF

        </div>


        <div>

            이상감지 알고리즘 기반 데이터 취재 시그널 플랫폼

        </div>


    </div>


</footer>


</body>

</html>
