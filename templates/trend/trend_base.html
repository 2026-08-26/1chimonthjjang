<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        DATA TIP-OFF | 미디어 트렌드 이상감지 시스템
    </title>


    <!--
        기존 상세 페이지가 Tailwind를 사용하고 있기 때문에
        상세 페이지 호환성을 위해 유지합니다.
    -->
    <script src="https://cdn.tailwindcss.com"></script>


    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>

        /* =========================================
           공통 색상
        ========================================= */

        :root {

            --black:
                #101010;

            --white:
                #ffffff;

            --bg:
                #f4f4f2;

            --gray-1:
                #565656;

            --gray-2:
                #8b8b87;

            --gray-3:
                #cfcfca;

            --gray-4:
                #e7e7e2;

            --gray-5:
                #f8f8f5;
        }


        * {
            box-sizing:
                border-box;
        }


        html {
            scroll-behavior:
                smooth;
        }


        body {

            margin:
                0;

            background:
                var(--bg);

            color:
                var(--black);

            font-family:
                Pretendard,
                "Noto Sans KR",
                Arial,
                sans-serif;
        }


        a {

            color:
                inherit;

            text-decoration:
                none;
        }


        /* =========================================
           메인페이지 스타일 헤더
        ========================================= */

        .global-header {

            height:
                72px;

            padding:
                0 34px;

            background:
                var(--black);

            color:
                var(--white);

            border-bottom:
                1px solid #2b2b2b;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            position:
                sticky;

            top:
                0;

            z-index:
                1000;
        }


        .global-header-left {

            display:
                flex;

            align-items:
                center;

            gap:
                26px;

            min-width:
                0;
        }


        /* =========================================
           햄버거
        ========================================= */

        .menu-link {

            width:
                44px;

            height:
                44px;

            flex:
                0 0 auto;

            border:
                1px solid #555;

            display:
                grid;

            place-items:
                center;

            font-size:
                18px;

            transition:
                background .2s ease,
                color .2s ease;
        }


        .menu-link:hover {

            background:
                white;

            color:
                black;
        }


        /* =========================================
           로고
        ========================================= */

        .global-brand {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                22px;

            font-weight:
                900;

            letter-spacing:
                -1px;

            white-space:
                nowrap;
        }


        .global-divider {

            width:
                1px;

            height:
                22px;

            background:
                #555;
        }


        .global-subtitle {

            color:
                #b7b7b7;

            font-size:
                10px;

            letter-spacing:
                1px;

            white-space:
                nowrap;
        }


        /* =========================================
           오른쪽 메뉴
        ========================================= */

        .global-header-right {

            display:
                flex;

            align-items:
                center;

            gap:
                30px;
        }


        .global-nav {

            display:
                flex;

            align-items:
                center;

            gap:
                30px;
        }


        .global-nav a {

            position:
                relative;

            color:
                #d5d5d5;

            font-size:
                10px;

            font-weight:
                800;

            transition:
                color .2s ease;
        }


        .global-nav a:hover {

            color:
                white;
        }


        .global-nav a.active {

            color:
                white;
        }


        .global-nav a.active::after {

            content:
                "";

            position:
                absolute;

            left:
                0;

            right:
                0;

            bottom:
                -10px;

            height:
                1px;

            background:
                white;
        }


        /* =========================================
           시스템 상태
        ========================================= */

        .global-status {

            display:
                flex;

            align-items:
                center;

            gap:
                8px;

            color:
                #d5d5d5;

            font-size:
                9px;

            font-weight:
                700;

            white-space:
                nowrap;
        }


        .global-status-dot {

            width:
                6px;

            height:
                6px;

            border-radius:
                50%;

            background:
                #e7e7e7;

            animation:
                statusBlink
                1.6s
                ease-in-out
                infinite;
        }


        @keyframes statusBlink {

            0%,
            100% {

                opacity:
                    1;
            }

            50% {

                opacity:
                    .3;
            }
        }


        /* =========================================
           페이지 전체 폭
        ========================================= */

        .page-shell {

            width:
                min(
                    1540px,
                    calc(100% - 64px)
                );

            margin:
                0 auto;

            padding:
                34px 0 64px;
        }


        /* =========================================
           Footer
        ========================================= */

        .global-footer {

            border-top:
                1px solid
                var(--gray-3);

            background:
                #efefec;

            color:
                var(--gray-2);
        }


        .global-footer-inner {

            width:
                min(
                    1540px,
                    calc(100% - 64px)
                );

            margin:
                0 auto;

            min-height:
                72px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                space-between;

            gap:
                24px;

            font-size:
                9px;

            letter-spacing:
                .4px;
        }


        .global-footer strong {

            color:
                var(--black);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size:
                13px;
        }


        /* =========================================
           반응형
        ========================================= */

        @media (
            max-width:
            980px
        ) {

            .global-subtitle,
            .global-divider {

                display:
                    none;
            }


            .global-nav {

                gap:
                    18px;
            }


            .page-shell,
            .global-footer-inner {

                width:
                    min(
                        calc(100% - 32px),
                        1540px
                    );
            }
        }


        @media (
            max-width:
            720px
        ) {

            .global-header {

                height:
                    auto;

                min-height:
                    66px;

                padding:
                    10px 16px;

                gap:
                    16px;
            }


            .menu-link {

                width:
                    38px;

                height:
                    38px;
            }


            .global-brand {

                font-size:
                    18px;
            }


            .global-header-right {

                gap:
                    14px;
            }


            .global-nav {

                display:
                    none;
            }


            .global-status {

                font-size:
                    8px;
            }


            .page-shell {

                width:
                    calc(100% - 24px);

                padding-top:
                    20px;
            }


            .global-footer-inner {

                width:
                    calc(100% - 24px);

                min-height:
                    86px;

                flex-direction:
                    column;

                justify-content:
                    center;

                align-items:
                    flex-start;
            }
        }

    </style>


    {% block extra_head %}
    {% endblock %}

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================= -->

    <header class="global-header">


        <div class="global-header-left">


            <!-- 메인 이동 -->
            <a
                href="/"
                class="menu-link"
                aria-label="메인 페이지로 이동"
                title="메인 페이지"
            >
                ☰
            </a>


            <!-- 브랜드 -->
            <a
                href="/"
                class="global-brand"
            >
                DATA TIP-OFF
            </a>


            <div
                class="global-divider"
            ></div>


            <div
                class="global-subtitle"
            >
                디지털 뉴스룸 / 취재 시그널 모니터
            </div>


        </div>


        <div class="global-header-right">


            <!-- 메인 페이지와 동일한 분야 -->
            <nav
                class="global-nav"
                aria-label="분야 메뉴"
            >

                <a href="/social">
                    사회
                </a>

                <a href="/economy">
                    경제
                </a>

                <a
                    href="/trend"
                    class="active"
                >
                    K콘텐츠
                </a>

                <a href="/baseball">
                    야구
                </a>

            </nav>


            <div class="global-status">

                <span
                    class="global-status-dot"
                ></span>

                탐지 시스템 활성화

            </div>


        </div>


    </header>


    <!-- =========================================
         CONTENT
    ========================================= -->

    <main class="page-shell">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =========================================
         FOOTER
    ========================================= -->

    <footer class="global-footer">

        <div
            class="global-footer-inner"
        >

            <strong>
                DATA TIP-OFF
            </strong>

            <span>
                이상감지 알고리즘 기반
                미디어 취재 데이터 분석 시스템
            </span>

        </div>

    </footer>


</body>

</html>
