<style>
.temp-chart-player strong{font-size:18px!important}.temp-chart-player span,.temp-chart-scale{font-size:13px!important}.temp-chart-row{min-height:66px!important}.bb-desk{scroll-margin-top:100px}.bb-desk h2{scroll-margin-top:100px}
.baseball-table th{font-size:14px!important;color:#444!important}.baseball-table td{font-size:18px!important;padding:20px 14px!important;font-variant-numeric:tabular-nums}.baseball-table .condition{font-size:14px;padding:8px}.player-open{font:700 21px Georgia,'Noto Serif KR',serif;background:none;color:inherit;border:0;text-align:left;cursor:pointer;padding:8px 0}.player-open span{display:block;font:12px sans-serif;margin-top:6px}.weather-tab{font-size:16px!important;padding:18px 24px!important}.section-head-desc,.hint,.question-box p,.data-note,.temp-chart-sub,.temp-chart-legend,.temp-chart-foot{font-size:14px!important;line-height:1.8!important}.question-box h4{font-size:21px!important}.temp-chart-card [class*="name"],.temp-chart-card [class*="value"]{font-size:18px!important}.temp-chart-card [class*="condition"]{font-size:13px!important}.signal-metrics strong{font-size:30px!important}.signal-metrics span{font-size:14px!important}.baseball-table tr:focus-within{outline:2px solid #866936;outline-offset:-2px}
.bb-desk{background:#faf8f1;border-top:4px solid #222;color:#222;padding:32px}.bb-desk h2,.bb-profile h2{font:700 clamp(26px,3vw,38px) Georgia,'Noto Serif KR',serif;line-height:1.4;margin:12px 0}.bb-desk h3{font:700 23px Georgia,'Noto Serif KR',serif;margin:20px 0}.bb-desk p,.bb-desk li{font-size:16px;line-height:1.9}.bb-toolbar{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid #bcb8ab;padding-bottom:22px}.bb-button{padding:13px 20px;background:#222;color:#fff;border:1px solid #222;font:600 15px sans-serif;cursor:pointer}.bb-button:disabled{opacity:.5;cursor:wait}.bb-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.bb-metric{padding:22px;background:#eeece2;border-top:2px solid #777}.bb-metric small{display:block;font-size:14px;margin-bottom:12px;color:#555}.bb-metric strong{font-size:32px;font-variant-numeric:tabular-nums}.bb-metric .up{color:#b53f34}.bb-metric .down{color:#365e82}.bb-columns{display:grid;grid-template-columns:1fr 1fr;gap:30px}.bb-columns ul{padding-left:23px}.bb-draft{margin-top:28px;padding:24px;background:#fffef9;border:1px solid #bab5a8}.bb-draft p{max-width:85ch}.bb-desk details{padding:18px 0;border-top:1px solid #bcb8ab}.bb-desk summary{font-size:16px;cursor:pointer}.bb-status{color:#666;font-size:14px!important}.bb-profile{border:1px solid #222;padding:28px;max-width:760px;width:calc(100% - 32px);max-height:85vh;overflow:auto;background:#faf8f1;color:#222}.bb-profile::backdrop{background:#0008}.bb-profile-grid{display:grid;grid-template-columns:160px 1fr;gap:24px;margin:20px 0}.bb-photo{background:#ece9df;min-height:190px;display:grid;place-items:center}.bb-photo img{width:160px;object-fit:contain}.bb-profile dl{display:grid;grid-template-columns:110px 1fr;font-size:16px;line-height:1.8;gap:8px}.bb-profile dd{margin:0}.bb-profile a{color:#315d8b;text-decoration:underline}.bb-profile button:focus-visible,.bb-desk button:focus-visible,.player-open:focus-visible{outline:3px solid #ad8443;outline-offset:4px}.bb-profile small{font-size:13px}.bb-draft textarea{width:100%;min-height:250px;font:16px/1.8 sans-serif}@media(max-width:650px){.bb-desk{padding:20px 16px}.bb-toolbar{display:block}.bb-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.bb-metric{padding:14px}.bb-metric strong{font-size:27px}.bb-columns{grid-template-columns:1fr}.bb-profile-grid{grid-template-columns:1fr}.bb-photo{max-width:160px}.bb-profile dl{grid-template-columns:95px 1fr}.bb-draft{padding:16px}.baseball-table{min-width:820px}}
</style>
<section class="section bb-desk" aria-labelledby="bb-title">
 <div class="bb-toolbar"><div><small>04 / BASEBALL REPORTER</small><h2 id="bb-title">숫자로 읽는 선수의 변화</h2><p id="bb-selection">전체 조건 중 가장 강한 이상신호를 분석합니다. 표에서 선수를 선택할 수 있습니다.</p></div><button type="button" id="bb-generate" class="bb-button">브리핑·기사 초안 생성 ↗</button></div>
 <p id="bb-status" class="bb-status" role="status"></p><div id="bb-result"></div>
</section>
<dialog id="bb-profile" class="bb-profile" aria-labelledby="bb-profile-title"><button type="button" class="bb-button" id="bb-close">닫기 ✕</button><h2 id="bb-profile-title">선수 프로필</h2><div id="bb-profile-content" aria-live="polite"></div><button type="button" class="bb-button" id="bb-use-player">이 선수 조건으로 브리핑 작성</button></dialog>
{% raw %}
<script>
(()=>{
 const $=id=>document.getElementById(id),node=(tag,text,parent,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;parent.append(e);return e;};
 let selection=null,pending=null,profileSerial=0,profileController;
 const button=$('bb-generate'),status=$('bb-status'),result=$('bb-result'),dialog=$('bb-profile');
 $('bb-close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{profileSerial++;profileController?.abort();});
 document.querySelectorAll('.player-open').forEach(b=>b.addEventListener('click',async()=>{
  pending={name:b.dataset.name,kind:b.dataset.kind,group:b.dataset.group};$('bb-profile-title').textContent=pending.name+' · 선수 프로필';const content=$('bb-profile-content');content.textContent='프로필을 불러오고 있습니다…';dialog.showModal();const token=++profileSerial;profileController?.abort();profileController=new AbortController();
  try{const response=await fetch('/api/baseball-player?name='+encodeURIComponent(pending.name),{signal:profileController.signal});const p=await response.json();if(!response.ok)throw Error(p.error||'조회 실패');if(token!==profileSerial)return;content.replaceChildren();const grid=node('div','',content,'bb-profile-grid'),photo=node('div','',grid,'bb-photo');const placeholder=node('span','사진 확인 중',photo);
   if(p.photo){const img=node('img','',photo);img.alt=p.name+' KBO 공식 프로필 사진';img.onload=()=>placeholder.remove();img.onerror=()=>{img.remove();placeholder.textContent='사진을 불러올 수 없습니다';};img.src=p.photo;}else placeholder.textContent='사진 정보 없음';
   const dl=node('dl','',grid);for(const [label,value] of [['2019 소속팀',p.team],['생년월일',p.birthday],['포지션·투타',p.position],['신장·체중',p.physique],['경력',p.career]]){node('dt',label,dl);node('dd',value||'공식 페이지 확인 필요',dl);}node('p',p.status,content,'bb-status');if(p.source_url){const a=node('a','KBO 공식 프로필 열기 ↗',content);a.href=p.source_url;a.target='_blank';a.rel='noopener noreferrer';}
  }catch(e){if(token===profileSerial)content.textContent='프로필 조회에 실패했습니다. 선수 데이터 분석은 계속 사용할 수 있습니다.';}
 }));
 $('bb-use-player').onclick=()=>{selection={...pending};$('bb-selection').textContent=`${selection.name} · ${{temp:'기온',humidity:'습도',rain:'강수'}[selection.kind]} / ${selection.group} · 2019 시즌`;dialog.close();button.click();$('bb-title').scrollIntoView({behavior:'smooth'});};
 async function post(url,payload){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),55000);try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl.signal});const data=await r.json();if(!r.ok)throw Error(data.error||'요청 실패');return data;}finally{clearTimeout(timer);}}
 button.onclick=async()=>{
  button.disabled=true;document.querySelectorAll('.player-open').forEach(b=>b.disabled=true);status.textContent='선수 데이터와 기사 초안을 작성하고 있습니다…';
  try{const r=await post('/api/baseball-desk-report',selection||{});result.replaceChildren();selection=r.selection;$('bb-selection').textContent=`${selection.name} · ${selection.group} · 2019 시즌`;
   node('p',r.briefing.replace(/<\/?strong>/gi,''),result);const metrics=node('div','',result,'bb-metrics');r.metrics.forEach(m=>{const card=node('div','',metrics,'bb-metric');node('small',m.label,card);node('strong',m.value,card,m.direction);});
   const cols=node('div','',result,'bb-columns');for(const [title,items] of [['기사 아이디어',r.article_ideas],['후속 취재 질문',r.questions]]){const section=node('section','',cols);node('h3',title,section);const ul=node('ul','',section);items.forEach(t=>node('li',t,ul));}
   const verify=node('details','',result);node('summary','추가 확인할 데이터',verify);r.verification_data.forEach(t=>node('p',t,verify));
   const draft=node('article','',result,'bb-draft'),draftStatus=node('p','',draft,'bb-status'),body=node('div','',draft),history=node('div','',draft);let current=r.draft,version=1;draftStatus.setAttribute('role','status');
   function render(){body.replaceChildren();node('small','기사 초안 · 버전 '+version,body);node('h2',current.title,body);current.paragraphs.forEach(t=>node('p',t,body));draftStatus.textContent=current.status;}
   render();const copy=node('button','초안 복사',draft,'bb-button');copy.type='button';copy.onclick=async()=>{const text=[current.title,...current.paragraphs].join('\n\n');try{await navigator.clipboard.writeText(text);draftStatus.textContent='초안을 복사했습니다.';}catch{const area=node('textarea',text,draft);area.readOnly=true;area.select();draftStatus.textContent='선택된 텍스트를 복사해주세요.';}};
   const retry=node('button','초안 다시 작성',draft,'bb-button');retry.type='button';retry.style.margin='12px';retry.onclick=async()=>{retry.disabled=true;button.disabled=true;draftStatus.textContent='초안을 다시 작성하고 있습니다…';try{const next=await post('/api/baseball-desk-draft',{draft_token:r.draft_token,selected_articles:[]});const old=node('details','',history);node('summary','이전 초안 · 버전 '+version,old);node('h3',current.title,old);current.paragraphs.forEach(t=>node('p',t,old));current=next.draft;version++;render();}catch(e){draftStatus.textContent='재작성에 실패했습니다. 기존 초안은 유지됩니다.';}finally{retry.disabled=false;button.disabled=false;}};
   status.textContent='브리핑과 초안이 준비되었습니다. 날씨와 성적 사이의 인과관계는 별도 검증이 필요합니다.';
  }catch(e){status.textContent='생성에 실패했습니다. 다시 시도해주세요. 기존 결과는 유지됩니다.';}finally{button.disabled=false;document.querySelectorAll('.player-open').forEach(b=>b.disabled=false);}
 };
})();
</script>
