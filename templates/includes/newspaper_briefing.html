<style>
.paper-brief{background:#faf8f1;color:#24241f;border-top:5px solid #24241f;border-bottom:1px solid #24241f;padding:32px;box-shadow:0 3px 14px #24241f08}.paper-masthead{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid #aaa89c;padding-bottom:12px;font-size:11px;letter-spacing:1.4px}.paper-brief h2{font-family:Georgia,'Noto Serif KR','Batang',serif;font-size:clamp(26px,4vw,42px);line-height:1.35;letter-spacing:-1px;margin:22px 0 8px}.paper-deck{color:#68675d;font-size:14px;line-height:1.8}.paper-toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:3px double #aaa89c}.paper-toolbar fieldset{border:0;padding:0;margin:0}.paper-toolbar legend{font-weight:700;margin-bottom:10px;font-size:14px}.paper-toolbar label{display:inline-flex;gap:7px;align-items:center;margin-right:16px;font-size:14px;cursor:pointer}.paper-brief button{background:#24241f;color:#faf8f1;border:1px solid #24241f;padding:13px 18px;cursor:pointer;font:inherit;font-size:14px}.paper-brief button:disabled{opacity:.5;cursor:wait}.paper-brief :focus-visible{outline:3px solid #986c28;outline-offset:4px}.paper-status{font-size:13px;line-height:1.7;color:#68675d}.paper-summary{font-size:17px;line-height:1.95;max-width:85ch}.paper-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.paper-metric{padding:20px;background:#f0eee5;border-top:2px solid #6c6a5d;min-width:0}.paper-metric small{display:block;color:#626156;font-size:12px;line-height:1.6;margin-bottom:12px}.paper-metric strong{font-size:clamp(23px,3vw,32px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.paper-metric .up{color:#b13f33}.paper-metric .down{color:#315d8b}.paper-columns{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:28px 0}.paper-brief h3{font-family:Georgia,'Batang',serif;font-size:21px;border-top:1px solid #aaa89c;padding-top:18px;margin:0 0 14px}.paper-brief li{font-size:14px;line-height:1.9;margin:10px 0}.paper-brief ul,.paper-brief ol{padding-left:22px}.paper-brief details{border-top:1px solid #aaa89c;padding:18px 0}.paper-brief summary{cursor:pointer;font-weight:700}.paper-news-row{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid #d8d5c8;padding:16px 0}.paper-news-row input{margin-top:5px;flex-shrink:0}.paper-news-row small{display:block;color:#68675d;margin-bottom:6px;line-height:1.5}.paper-brief a{color:#315d8b;text-decoration:underline;text-underline-offset:4px;line-height:1.7;overflow-wrap:anywhere}.paper-note{font-size:12px;color:#68675d;line-height:1.8;border-top:1px solid #d8d5c8;padding-top:16px}.paper-brief [hidden]{display:none!important}@media(max-width:640px){.paper-brief{padding:20px 16px}.paper-masthead{flex-direction:column;gap:6px}.paper-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.paper-metric{padding:14px}.paper-columns{grid-template-columns:1fr;gap:16px}.paper-toolbar button{width:100%}}
.paper-draft{margin:28px 0;padding:24px;border:1px solid #aaa89c;background:#fffef9}.paper-draft p{line-height:1.95;overflow-wrap:anywhere}.paper-draft h2{font-size:clamp(24px,3vw,34px)}.paper-draft-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.paper-draft textarea{width:100%;min-height:300px;font:inherit;line-height:1.8}.paper-draft:focus{outline:2px solid #986c28}@media(max-width:640px){.paper-draft{padding:16px}}
</style>
<section class="paper-brief" aria-labelledby="paper-title">
 <div class="paper-masthead"><strong>DATA TIP-OFF · 취재 브리핑</strong><span>{{ item.region }} / {{ item.date }}</span></div>
 <h2 id="paper-title">숫자에서 시작하는 다음 기사</h2>
 <p class="paper-deck">핵심 수치로 기사 초안을 작성하고, 선택한 관련 보도를 반영해 다시 다듬습니다.</p>
 <div class="paper-toolbar">
  <fieldset><legend>브리핑에 관련 기사를 추가할까요?</legend><label><input type="radio" name="paper-news" value="no" checked>데이터만 보기</label><label><input type="radio" name="paper-news" value="yes">기사 찾아서 선택하기</label></fieldset><label>기사 검색 범위 <select id="paper-news-scope"><option value="month">데이터 기준월</option><option value="year">같은 해 전체</option></select></label>
  <button type="button" id="paper-generate">취재 브리핑 생성 ↗</button>
 </div>
 <p id="paper-status" class="paper-status" role="status" aria-live="polite">선택한 시그널의 데이터로 브리핑을 생성합니다.</p>
 <div id="paper-output" hidden></div>
 <p class="paper-note">통계적 변화는 원인을 입증하지 않습니다. 관련 보도는 해당 데이터 월을 기준으로 검색하며, 기사 본문과 원자료는 별도 확인이 필요합니다.</p>
</section>
<script>
(()=>{
 const button=document.getElementById('paper-generate'),out=document.getElementById('paper-output'),status=document.getElementById('paper-status');
 const endpoint={{ ('/api/social-report/' if item.natural_now is defined else '/api/economy-report/')|tojson }}+encodeURIComponent({{ item.signal_type|tojson }})+'?region='+encodeURIComponent({{ item.region|tojson }});
 const node=(tag,text,parent,cls)=>{const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;parent.append(el);return el;};
 const link=(article,parent)=>{try{const url=new URL(article.url);if(!['https:','http:'].includes(url.protocol))return;const a=node('a',article.title,parent);a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';}catch{}};
 const list=(title,items,parent)=>{const section=node('section','',parent);node('h3',title,section);const ul=node('ol','',section);(items||[]).forEach(text=>node('li',text,ul));};
 button.addEventListener('click',async()=>{
  button.disabled=true;button.textContent='브리핑 생성 중…';out.hidden=true;out.setAttribute('aria-busy','true');status.textContent='데이터를 정리하고 있습니다.';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),65000);
  try{
   const includeNews=document.querySelector('input[name="paper-news"]:checked').value==='yes';
   if(includeNews)status.textContent='데이터와 해당 월의 관련 기사를 조회하고 있습니다.';
   const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({include_news:includeNews,news_scope:document.getElementById("paper-news-scope").value}),signal:controller.signal});
   const data=await response.json();if(!response.ok||data.error)throw Error(data.error||'브리핑 생성에 실패했습니다.');
   out.replaceChildren();node('h2',data.title+' · 취재 브리핑',out);
   // Existing APIs use strong tags. Strip them as text; never execute report markup.
   node('p',String(data.briefing||'').replace(/<\/?strong>/gi,''),out,'paper-summary');
   const metrics=node('div','',out,'paper-metrics');(data.metrics||[]).forEach(m=>{const card=node('div','',metrics,'paper-metric');node('small',m.label,card);node('strong',m.value,card,m.direction);});
   const columns=node('div','',out,'paper-columns');list('01. 기사 아이디어',data.article_ideas,columns);list('02. 후속 취재 질문',data.questions,columns);
   const verify=node('details','',out);node('summary','03. 취재 전 확인할 자료',verify);const ul=node('ul','',verify);(data.verification_data||[]).forEach(v=>node('li',v,ul));
   const draftSection=node('article','',out,'paper-draft');draftSection.tabIndex=-1;
   const draftStatus=node('p','',draftSection,'paper-status');draftStatus.setAttribute('role','status');
   const draftBody=node('div','',draftSection,'paper-draft-current');let currentDraft=null,revision=1,currentCount=0;
   const history=node('div','',draftSection,'paper-history');
   function archiveDraft(){
    const entry=node('details','',history);node('summary',`이전 초안 · 버전 ${revision} · ${currentCount ? '보도 '+currentCount+'건 반영' : '데이터 기반'}`,entry);
    node('h2',currentDraft.title,entry);currentDraft.paragraphs.forEach(p=>node('p',p,entry));currentDraft.sources.forEach(a=>link({...a,title:`[${a.id}] ${a.title}`},node('p','',entry)));
   }
   function renderDraft(draft,count){
    currentDraft=draft;currentCount=count;draftBody.replaceChildren();
    node('small',`기사 초안 · 버전 ${revision} · ${count ? '선택 보도 '+count+'건 반영' : '데이터 기반'}`,draftBody);
    node('h2',draft.title,draftBody);draft.paragraphs.forEach(p=>node('p',p,draftBody));
    if(draft.sources.length){node('h3','반영한 출처',draftBody);draft.sources.forEach(a=>{const row=node('p','',draftBody);node('span',`[${a.id}] ${a.publisher || ''} · ${a.date || ''} `,row);link(a,row);});}
    draftStatus.textContent=draft.status;
   }
   renderDraft(data.draft,0);
   const actions=node('div','',draftSection,'paper-draft-actions');
   const copy=node('button','초안 복사',actions);copy.type='button';
   copy.addEventListener('click',async()=>{const text=[currentDraft.title,...currentDraft.paragraphs,...currentDraft.sources.map(a=>`[${a.id}] ${a.title} ${a.url}`)].join('\n\n');try{await navigator.clipboard.writeText(text);draftStatus.textContent='초안을 복사했습니다.';}catch{const area=node('textarea',text,draftSection);area.readOnly=true;area.setAttribute('aria-label','복사할 기사 초안');area.focus();area.select();draftStatus.textContent='선택된 텍스트를 복사해주세요.';}});
   const retry=node('button','초안 다시 작성',actions);retry.type='button';
   let applied=[],applyButton=null,checks=[];
   async function rewrite(indexes){
    button.disabled=true;retry.disabled=true;if(applyButton)applyButton.disabled=true;checks.forEach(c=>c.disabled=true);
    draftStatus.textContent=indexes.length ? `선택한 기사 ${indexes.length}건을 반영해 초안을 다시 작성하고 있습니다…` : '데이터로 초안을 다시 작성하고 있습니다…';
    draftSection.setAttribute('aria-busy','true');
    const ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),55000);
    try{
     const response=await fetch({{ ('/api/social-draft' if item.natural_now is defined else '/api/economy-draft')|tojson }},{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft_token:data.draft_token,selected_articles:indexes}),signal:ctrl.signal});
     const result=await response.json();if(!response.ok||result.error)throw Error(result.error||'초안 재작성에 실패했습니다.');
     archiveDraft();applied=[...indexes];revision++;renderDraft(result.draft,applied.length);draftSection.focus({preventScroll:true});draftSection.scrollIntoView({behavior:'smooth',block:'start'});
    }catch(error){draftStatus.textContent=(error.name==='AbortError'?'작성 시간이 초과되었습니다.':error.message)+' 기존 초안은 유지됩니다. 다시 시도해주세요.';}
    finally{clearTimeout(timeout);button.disabled=false;retry.disabled=false;if(applyButton)applyButton.disabled=false;checks.forEach(c=>c.disabled=false);draftSection.setAttribute('aria-busy','false');}
   }
   retry.addEventListener('click',()=>rewrite(applied));
   if(includeNews){
    const news=node('section','',out);node('h3','04. 관련 기사 선택',news);node('p',data.news_status,news,'paper-status');
    if(data.news_scope==='year')node('p','같은 해 전체 보도입니다. 데이터 기준월과 보도 시점의 차이를 확인해주세요.',news,'paper-status');
    if(!(data.articles||[]).length)node('p','원문 기사 링크가 아닌 검색 링크입니다. 결과를 찾지 못하면 위 검색 범위를 같은 해 전체로 바꾸고 브리핑을 다시 생성해주세요.',news,'paper-status');
    const articles=data.articles||[];
    articles.forEach(a=>{const row=node('div','',news,'paper-news-row');const check=node('input','',row);check.type='checkbox';check.setAttribute('aria-label',a.title+' 추가');checks.push(check);const content=node('div','',row);node('small',a.date+' · '+a.publisher,content);link(a,content);});
    if(articles.length){
     applyButton=node('button','선택 기사로 초안 다시 작성 (0)',news);applyButton.type='button';applyButton.disabled=true;
     checks.forEach(c=>c.addEventListener('change',()=>{const count=checks.filter(c=>c.checked).length;applyButton.textContent=count ? `선택 기사로 초안 다시 작성 (${count})` : '기사 제외하고 초안 다시 작성';applyButton.disabled=false;}));
     applyButton.addEventListener('click',()=>rewrite(checks.flatMap((c,i)=>c.checked?[i]:[])));
    }
    if(data.news_search_url)link({title:'같은 조건으로 일반 웹 검색 ↗',url:data.news_search_url},node('p','',news));
    node('p','기사 조합을 바꾸고 적용하면 새 버전이 생성되며 이전 초안도 남습니다. 모두 해제하면 데이터만 반영합니다. 초안은 새로고침 전에 복사해주세요.',news,'paper-status');
   }
   out.hidden=false;status.textContent='브리핑이 준비되었습니다.';
  }catch(error){status.textContent=error.name==='AbortError'?'응답 시간이 초과되었습니다. 다시 시도해주세요.':(error.message||'오류가 발생했습니다. 다시 시도해주세요.');}
  finally{clearTimeout(timer);button.disabled=false;button.textContent='브리핑 다시 생성 ↗';out.setAttribute('aria-busy','false');}
 });
})();
</script>
